number: 11
title: 'Core Dispatch #11'
slug: 2026-w41
period_start: '2026-08-27'
period_end: '2026-10-09'
editorial_notes: |
  Welcome back to Core Dispatch! This edition covers August 27 through October 9,
  2026 (It's been a while 😅). [Python 3.15.0 final](https://www.python.org/downloads/release/python-3150/)
  landed today after an extra release candidate for lazy-import blockers.
  Huge congrats to Hugo van Kemenade for getting the 3.14 and 3.15 feature
  releases out the door!
  The [latest maintenance releases](https://blog.python.org/2026/10/python-31022-31117/)
  also mark Python 3.10's end of life and 3.13's move to security-only support.
  Python 3.16.0 alpha 1 is expected on October 13.

  New PEPs revisit `None`-aware access, coalescing operators, incremental
  garbage collection, and more expressive type annotations. PEP 755 was
  withdrawn; PyPI's namespace rules will instead live in PyPI policy. On
  CPython's main branch, notable merges improve free-threaded performance
  and fix security and memory-safety issues.

  The Python Language Summit writeups cover free-threading, garbage collection,
  the buffer protocol, and Rust in CPython. The PSF Board and inaugural Python
  Packaging Council election results are out, and Nathan Goldbaum and Sergey
  Miryanov have joined the core team.

  Please test your projects with Python 3.15.0 and publish compatible wheels
  where applicable. If you find a bug,
  [file a CPython issue](https://github.com/python/cpython/issues).
