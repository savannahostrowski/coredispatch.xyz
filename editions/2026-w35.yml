number: 10
title: 'Core Dispatch #10'
slug: 2026-w35
period_start: '2026-08-05'
period_end: '2026-08-27'
editorial_notes: |
  Welcome back to Core Dispatch! This edition covers August 5 through August 27,
  2026. Python 3.12.14, 3.11.16, and 3.10.21 shipped on August 12. Next up is
  Python 3.15.0 release candidate 2, due September 1.

  There are five new PEPs to catch up on. [PEP 805](https://peps.python.org/pep-0805/)
  proposes a model for safe parallel Python. [PEP 843](https://peps.python.org/pep-0843/)
  and [PEP 844](https://peps.python.org/pep-0844/) offer two approaches to
  explicit module exports. [PEP 841](https://peps.python.org/pep-0841/) proposes
  syntax for frozen types, while [PEP 839](https://peps.python.org/pep-0839/)
  adds C APIs for building immutable collections. [PEP 833](https://peps.python.org/pep-0833/)
  also reached Final, freezing the HTML form of the simple repository API. HTML
  support stays, but future standards work moves to JSON. Speaking of PEPs, PEP
  11 was also updated to list RISC-V as a [tier 3](https://peps.python.org/pep-0011/#tier-3)
  platform.

  Many core team members spoke about Python core development at EuroPython this
  year. All nine talks are in this edition's Core Team Musings, covering the
  CPython ABI, the JIT, free-threading, interpreter internals, security, and
  contributing to Python. Voters can also catch up on nominee AMAs for the PSF
  Board and inaugural Python Packaging Council elections before ballots open on
  September 1.

  Python 3.15 is in the release candidate phase, so this is the moment
  for maintainers to test their projects and
  [publish Python 3.15 wheels to PyPI](https://discuss.python.org/t/python-3-15-0-release-candidate-1-is-here/108395#p-298000-call-to-action-1).
  Wheels built against the 3.15 release candidates will work with future 3.15
  releases, and publishing them now helps downstream projects test too. Please
  [file any CPython issues](https://github.com/python/cpython/issues) you find.
