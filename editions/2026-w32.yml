number: 9
title: 'Core Dispatch #9'
slug: 2026-w32
period_start: '2026-07-18'
period_end: '2026-08-05'
editorial_notes: |
  Welcome back to Core Dispatch! This edition covers July 18 through August 5, 2026.
  Python 3.15.0 release candidate 1 landed on August 4, followed by Python 3.14.7
  and 3.13.15 on August 5. With the first release candidate here, 3.15 is firmly
  in the home stretch.

  Two new PEPs joined the queue this fortnight. [PEP 842](https://peps.python.org/pep-0842/)
  proposes explicit module exports, while [PEP 837](https://peps.python.org/pep-0837/)
  explores an extensible protocol for JSON serialization. There is also lively
  [pre-PEP discussion around PEP 841](https://discuss.python.org/t/pep-841-adding-frozen-syntax-to-make-immutable-types-optimizable/108219),
  which proposes `frozen` syntax for immutable types. [PEP 828](https://peps.python.org/pep-0828/)
  has also been accepted by its PEP delegate, clearing the way for `yield from`
  in asynchronous generators.

  Elsewhere, PyPI announced that releases will stop accepting new files after 14
  days, nominations for the inaugural Python Packaging Council are about to open,
  and core developer Petr Viktorin was named a PSF Fellow. If you missed
  EuroPython, this edition's Core Team Musings includes the new CPython and
  Steering Council panel recordings, along with the video edition of a very fun,
  live `core.py` interview with Guido van Rossum.

  Python 3.15 has now entered the release candidate phase, so this is the moment
  for maintainers to test their projects and
  [publish Python 3.15 wheels to PyPI](https://discuss.python.org/t/python-3-15-0-release-candidate-1-is-here/108395#p-298000-call-to-action-1).
  Wheels built against the 3.15 release candidates will work with future 3.15
  releases, and publishing them now helps downstream projects test too. Please
  [file any CPython issues](https://github.com/python/cpython/issues) you find.
