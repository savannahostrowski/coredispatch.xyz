version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      uv:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      bun:
        patterns:
          - "*"
    cooldown:
      default-days: 7
