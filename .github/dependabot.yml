version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      pip:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
